<!doctype html>
<html lang="en" style="width:100%; height:100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualization Viewer</title>
</head>
<body style="margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:Arial, Helvetica, sans-serif;">
  <div style="
      width:100%;
      height:100%;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      overflow:hidden;
  ">
    <div style="
        width:100%;
        flex:1 1 auto;
        min-height:0;
        display:flex;
        align-items:flex-start;
        justify-content:center;
        overflow:hidden;
    ">
      <img
        id="study-image"
        src="../numbered_imgs/241.png"
        alt="Visualization 241"
        style="
          display:block;
          max-width:80%;
          max-height:100%;
          width:auto;
          height:auto;
          object-fit:contain;
          margin:0 auto;
          cursor:zoom-in;
        "
        title="Click to zoom"
      >
    </div>
  </div>

  <div
    id="zoom-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Full size visualization"
    style="
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(0,0,0,0.88);
      overflow:auto;
    "
  >
    <div style="
        position:sticky;
        top:0;
        z-index:10000;
        display:flex;
        justify-content:center;
        gap:8px;
        padding:10px;
        background:rgba(0,0,0,0.78);
    ">
      <button id="zoom-out" type="button"
              style="min-width:54px; height:38px; font-size:18px; cursor:pointer;">−</button>
      <button id="zoom-reset" type="button"
              style="min-width:80px; height:38px; cursor:pointer;">Reset</button>
      <button id="zoom-in" type="button"
              style="min-width:54px; height:38px; font-size:18px; cursor:pointer;">+</button>
      <button id="close-zoom" type="button"
              style="min-width:80px; height:38px; cursor:pointer; background:#d32f2f; color:white; border:1px solid #b71c1c; border-radius:4px; font-weight:600;">Close</button>
    </div>

    <div
      id="zoom-stage"
      style="
        width:100%;
        height:calc(100% - 58px);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        box-sizing:border-box;
        overflow:hidden;
        cursor:grab;
        touch-action:none;
        user-select:none;
      "
    >
      <img
        id="zoom-image"
        src="../numbered_imgs/241.png"
        alt="Full size visualization 241"
        style="
          display:block;
          width:calc(100vw - 80px);
          height:calc(100vh - 150px);
          max-width:none;
          max-height:none;
          object-fit:contain;
          transform-origin:center center;
          transition:transform 120ms ease;
          user-select:none;
          -webkit-user-drag:none;
          pointer-events:none;
        "
      >
    </div>
  </div>

  <script>

    // Resize and center the ReVISit iframe itself. The installed ReVISit
    // schema does not allow component-level style, so the same-origin
    // website page adjusts its own frame element after loading.
    function setFrameHeight(expanded) {
      if (window.frameElement) {
        const height = expanded
          ? 'calc(100vh - 100px)'
          : 'calc(100vh - 420px)';

        window.frameElement.style.height = height;
        window.frameElement.style.maxHeight = height;
      }
    }

    function sizeRevisitFrame() {
      if (window.frameElement) {
        setFrameHeight(false);
        window.frameElement.style.width = '80vw';
        window.frameElement.style.maxWidth = '80vw';
        window.frameElement.style.display = 'block';
        window.frameElement.style.marginLeft = 'auto';
        window.frameElement.style.marginRight = 'auto';
      }
    }

    sizeRevisitFrame();
    window.addEventListener('resize', () => {
      const expanded = overlay.style.display !== 'none';
      setFrameHeight(expanded);
    });

    const overlay = document.getElementById('zoom-overlay');
    const zoomStage = document.getElementById('zoom-stage');
    const zoomImage = document.getElementById('zoom-image');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragOriginX = 0;
    let dragOriginY = 0;

    function applyTransform() {
      zoomImage.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function resetView() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function setScale(nextScale, anchorX = null, anchorY = null) {
      const oldScale = scale;
      const clampedScale = Math.min(4, Math.max(0.5, nextScale));

      if (clampedScale === oldScale) {
        return;
      }

      // If an anchor point is provided (e.g., the mouse cursor), adjust the
      // translation so zooming feels centered on that point.
      if (anchorX !== null && anchorY !== null && zoomStage) {
        const rect = zoomStage.getBoundingClientRect();
        const localX = anchorX - rect.left - rect.width / 2;
        const localY = anchorY - rect.top - rect.height / 2;

        const ratio = clampedScale / oldScale;
        translateX = localX - (localX - translateX) * ratio;
        translateY = localY - (localY - translateY) * ratio;
      }

      scale = clampedScale;
      applyTransform();
    }

    function closeOverlay() {
      isDragging = false;
      zoomStage.style.cursor = 'grab';
      overlay.style.display = 'none';
      setFrameHeight(false);
    }

    document.getElementById('study-image').addEventListener('click', () => {
      resetView();
      setFrameHeight(true);
      overlay.style.display = 'block';
    });

    document.getElementById('close-zoom').addEventListener('click', closeOverlay);

    document.getElementById('zoom-in').addEventListener('click', () => {
      setScale(scale + 0.25);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      setScale(scale - 0.25);
    });

    document.getElementById('zoom-reset').addEventListener('click', resetView);

    zoomStage.addEventListener('wheel', (event) => {
      event.preventDefault();

      // Trackpads and mouse wheels both work here. Smaller deltas produce a
      // smoother zoom; large wheel steps are clamped by setScale().
      const zoomFactor = Math.exp(-event.deltaY * 0.0015);
      setScale(
        scale * zoomFactor,
        event.clientX,
        event.clientY
      );
    }, { passive: false });

    zoomStage.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) {
        return;
      }

      isDragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragOriginX = translateX;
      dragOriginY = translateY;

      zoomStage.setPointerCapture(event.pointerId);
      zoomStage.style.cursor = 'grabbing';
    });

    zoomStage.addEventListener('pointermove', (event) => {
      if (!isDragging) {
        return;
      }

      translateX = dragOriginX + (event.clientX - dragStartX);
      translateY = dragOriginY + (event.clientY - dragStartY);
      applyTransform();
    });

    function stopDragging(event) {
      if (!isDragging) {
        return;
      }

      isDragging = false;
      zoomStage.style.cursor = 'grab';

      if (event && zoomStage.hasPointerCapture(event.pointerId)) {
        zoomStage.releasePointerCapture(event.pointerId);
      }
    }

    zoomStage.addEventListener('pointerup', stopDragging);
    zoomStage.addEventListener('pointercancel', stopDragging);

    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) {
        closeOverlay();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeOverlay();
      }
    });
  </script>
</body>
</html>
